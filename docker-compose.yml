services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tikmi
      POSTGRES_PASSWORD: tikmi
      POSTGRES_DB: tikmi
    ports:
      # Host 5432 is taken by another local project and 5434 by the IRA app; see README.
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
