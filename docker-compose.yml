services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ira
      POSTGRES_PASSWORD: ira
      POSTGRES_DB: ira
    ports:
      # Host 5432 is already taken by another local project's container; see README.
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
